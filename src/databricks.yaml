bundle:
  name: ontos

variables:
  sql_warehouse_id:
    description: "ID of the SQL warehouse to use"
    lookup:
      warehouse: "Serverless Starter Warehouse"
  llm_endpoint_name:
    description: "Model Serving endpoint name for Ontology Generator / Ask Ontos"
    default: "databricks-meta-llama-3-3-70b-instruct"
  catalog_name:
    description: "Name of the catalog to use"
    default: "classic_stable_kremer_catalog"
  schema_name:
    description: "Name of the schema to use"
    default: "app_ontos"
  volume_name:
    description: "Name of the volume to use"
    default: "app_files"
  app_config:
    type: complex
    description: "Configuration for Ontos"
    default:
      command:
        - "uvicorn"
        - "src.app:app"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
      env:
        - name: "DATABRICKS_WAREHOUSE_ID"
          value: ${var.sql_warehouse_id}
        - name: "DATABRICKS_CATALOG"
          value: ${var.catalog_name}
        - name: "DATABRICKS_SCHEMA"
          value: ${var.schema_name}
        - name: "DATABRICKS_VOLUME"
          value: ${var.volume_name}

resources:
  apps:
    ontos:
      name: "ontos"
      description: "Ontos"
      source_code_path: "."
      config: ${var.app_config}
      # Keep OBO scopes in the bundle so deploys don't wipe manifest scopes.
      # Model Serving still prefers the app SP (see llm_client.py).
      user_api_scopes:
        - "sql"
        - "serving.serving-endpoints"
        - "files.files"
        - "dashboards.genie"
        - "catalog.connections"
        - "catalog.catalogs:read"
        - "catalog.schemas:read"
        - "catalog.tables:read"
      resources:
        - name: "sql-warehouse"
          description: "SQL warehouse for the app"
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: "CAN_USE"
        - name: "serving-endpoint"
          description: "LLM serving endpoint for Ontology Generator / Ask Ontos"
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: "CAN_QUERY"
      permissions:
        - user_name: "*"
          level: "CAN_USE"

targets:
  dev:
    default: true
    variables:
      catalog_name: "classic_stable_kremer_catalog"
      schema_name: "ontos_test"
      volume_name: "app_files_dev"
  #prod:
  #  variables:
  #    catalog_name: "app_data_prod"
  #    schema_name: "app_ontos_prod"
  #    volume_name: "app_files_prod"
  no-lakebase:
    # Unity Catalog without Lakebase — uc_native SoR (no Postgres/Lakebase).
    # Bundle config overrides local app.yaml; STORAGE_MODE must be set here.
    variables:
      catalog_name: "classic_stable_kremer_catalog"
      schema_name: "ontos_test"
      volume_name: "app_files"
      app_config:
        command:
          - "python"
          - "backend/src/app.py"
        env:
          - name: "ENV"
            value: "PROD"
          - name: "STORAGE_MODE"
            value: "uc_native"
          - name: "APP_DEMO_MODE"
            value: "false"
          - name: "APP_AUDIT_VOLUME_ONLY"
            value: "true"
          - name: "APP_UC_MIRROR_ENABLED"
            value: "false"
          - name: "APP_UC_APP_SCHEMA"
            value: "app_ontos"
          - name: "PYTHONPATH"
            value: "./backend:${PYTHONPATH}"
          - name: "PYTHONUNBUFFERED"
            value: "1"
          - name: "FRONTEND_STATIC_DIR"
            value: "./static"
          - name: "DATABRICKS_WAREHOUSE_ID"
            value: ${var.sql_warehouse_id}
          - name: "DATABRICKS_CATALOG"
            value: ${var.catalog_name}
          - name: "DATABRICKS_SCHEMA"
            value: ${var.schema_name}
          - name: "DATABRICKS_VOLUME"
            value: ${var.volume_name}
          - name: "APP_ADMIN_DEFAULT_GROUPS"
            value: '["admins", "users"]'
          - name: "APP_AUDIT_LOG_DIR"
            value: "/Volumes/${var.catalog_name}/${var.schema_name}/${var.volume_name}/audit_logs"
          - name: "LLM_ENABLED"
            value: "True"
          - name: "LLM_ENDPOINT"
            value_from: "serving-endpoint"
