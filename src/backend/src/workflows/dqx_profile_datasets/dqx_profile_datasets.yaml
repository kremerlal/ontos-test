# UC-native note: set storage_mode=uc_native and leave lakebase_instance_name empty.
# Job entrypoints soft-skip Postgres writers until migrated to Delta stores.
name: "DQX Profile Datasets"
description: "Profile Unity Catalog datasets and generate quality check suggestions using DQX"
format: "MULTI_TASK"
environments:
  - environment_key: "dqx-env"
    spec:
      dependencies:
        - "databricks-labs-dqx==0.8.0"
        - "sqlalchemy"
        - "psycopg2-binary"
tasks:
  - task_key: "dqx_profile"
    spark_python_task:
      python_file: "dqx_profile_datasets.py"
      parameters:
        - "--contract_id"
        - "{{job.parameters.contract_id}}"
        - "--schema_names"
        - "{{job.parameters.schema_names}}"
        - "--profile_run_id"
        - "{{job.parameters.profile_run_id}}"
        - "--lakebase_instance_name"
        - "{{job.parameters.lakebase_instance_name}}"
        - "--storage_mode"
        - "{{job.parameters.storage_mode}}"
        - "--postgres_host"
        - "{{job.parameters.postgres_host}}"
        - "--postgres_db"
        - "{{job.parameters.postgres_db}}"
        - "--postgres_port"
        - "{{job.parameters.postgres_port}}"
        - "--postgres_schema"
        - "{{job.parameters.postgres_schema}}"
        - "--product_name"
        - "{{job.parameters.product_name}}"
        - "--product_version"
        - "{{job.parameters.product_version}}"
    environment_key: "dqx-env"

parameters:
  contract_id: ""
  schema_names: "[]"
  profile_run_id: ""
  lakebase_instance_name: ""
  # Empty/omit for STORAGE_MODE=uc_native (Delta SoR; no Lakebase OLTP).
  storage_mode: "uc_native"
  postgres_host: ""
  postgres_db: ""
  postgres_port: "5432"
  postgres_schema: "public"
  product_name: "ontos"
  product_version: "0.0.0"

timeout_seconds: 3600
max_concurrent_runs: 1

tags:
  environment: "production"
  owner: "ontos"

